description = "The white army office. A work product is checked by opening its own internal structure and examining whether its reasoning holds on its own terms — its proofs close, its rules are consistent, its logic is well-formed — judged from the inside rather than against an external standard or an adversary's attack. Duties: check a work products internal logical structure; check a work products internal mathematical structure; state the internal rule a structure satisfied or failed; report an anomaly noticed outside this offices lane."
